name: Build & Push to Tencent Cloud Container Registry

# 触发: 推送到 main / 手动 workflow_dispatch
on:
  push:
    branches: [main]
  workflow_dispatch:

# ================== 需要在 GitHub Repository → Settings → Secrets 填的变量 ==================
# TENCENTCCR_REGISTRY       例如 hkccr.ccs.tencentyun.com/taluo-xxxx (CCR 个人版/企业版实例地址+命名空间)
#                               如果是 TCR 企业版: tcr.tencentcloudcr.com 或 {你的实例}.tencentcloudcr.com
# TENCENTCCR_USERNAME       CCR 的"访问凭证 → 用户名"（通常是 账号ID，或 TCR 新建的长期访问凭证用户名）
# TENCENTCCR_PASSWORD       CCR 访问凭证密码（或者 TC API Key 的 SecretKey + 通过 tcr login 命令的那种 token 也行）
# ZHIPU_API_KEY             智谱 key —— 注意：这一项不建议直接塞镜像！本 workflow 只把它传到 TencentCloudBase 云托管服务的"环境变量设置"里，
#                               不会写进镜像。如果你打算用下面"部署到云托管"的 step，就要再配一个云托管访问的 token；
#                               最简单的做法是在 云托管控制台里手动改"服务配置 → 环境变量 → ZHIPU_API_KEY=xxx"就好了，不必在 CI 里操作。
# ===================================================================================================

env:
  IMAGE_NAME: taluo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM/amd64 跨平台兼容)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Cloud Container Registry (CCR/TCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TENCENTCCR_REGISTRY }}
          username: ${{ secrets.TENCENTCCR_USERNAME }}
          password: ${{ secrets.TENCENTCCR_PASSWORD }}

      - name: Build image tag (sha short + date)
        id: meta
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c 1-8)
          TAG="$(date +%Y%m%d)-${SHORT_SHA}"
          echo "tag=$TAG"          >> $GITHUB_OUTPUT
          echo "latest=latest"    >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.TENCENTCCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ secrets.TENCENTCCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms: linux/amd64

      - name: Output deployed image
        run: |
          echo "✅ 已推送到腾讯云 CCR:"
          echo "   ${{ secrets.TENCENTCCR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}"
          echo "下一步: 去 腾讯云云托管控制台 → 服务taluo → 部署新版本 → 镜像地址填上面这串 → 同时确认 环境变量 ZHIPU_API_KEY 已配"
